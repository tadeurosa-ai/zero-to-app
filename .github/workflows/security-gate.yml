name: Security Gate

# Pipeline self-hosted (nenhum código sai pro SaaS de terceiro) — SAST (Opengrep),
# dependências (Trivy) e segredos vazados (Betterleaks), no próprio repositório.
# Mesmo padrão já validado em outro projeto (13/11/2026). Sem caminhos protegidos
# aqui: o repositório só tem o texto da skill. DAST fora: a skill não tem app rodando.
#
# VERSÕES FIXAS DE PROPÓSITO (não "latest"): tag de Git é mutável (ataque real ao
# aquasecurity/trivy-action em março/2026 reescreveu tags existentes). Por isso as
# 3 ferramentas ficam fixas por VERSÃO conhecida e as Actions do GitHub por COMMIT
# SHA. Atualização sempre manual e deliberada, conferindo a fonte oficial antes.
env:
  TOOL_OPENGREP_VERSION: v1.30.0
  TOOL_TRIVY_VERSION: v0.74.0
  TOOL_BETTERLEAKS_VERSION: v1.8.1

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # toda segunda 06:00 UTC (03:00 em Brasília)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  opengrep:
    name: SAST (Opengrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar cosign (verificação de assinatura do binário)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Instalar Opengrep (versão fixa, assinatura verificada)
        # install.sh fixado no commit da tag v1.30.0 + hash conferido antes de rodar.
        # Ao trocar TOOL_OPENGREP_VERSION, atualizar os dois valores abaixo junto.
        env:
          OPENGREP_INSTALL_COMMIT: acf67b45c97c4b63626536605c77064ef536806d
          OPENGREP_INSTALL_SHA256: 4643968d05a2d5f9d4130c0c170fc096d6adf8131aca002ba2fd0e482ac52d0d
        run: |
          curl -fsSL -o opengrep-install.sh "https://raw.githubusercontent.com/opengrep/opengrep/${OPENGREP_INSTALL_COMMIT}/install.sh"
          echo "${OPENGREP_INSTALL_SHA256}  opengrep-install.sh" | sha256sum -c -
          bash opengrep-install.sh -v "$TOOL_OPENGREP_VERSION" --verify-signatures
          rm -f opengrep-install.sh
      - name: Rodar Opengrep (OWASP Top 10 + segredos)
        run: |
          "$HOME/.opengrep/cli/latest/opengrep" scan \
            --config p/owasp-top-ten --config p/secrets \
            --sarif --output=opengrep.sarif . || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-sarif
          path: opengrep.sarif
          if-no-files-found: warn

  trivy:
    name: Dependências (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar cosign (verificação de assinatura do binário)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Instalar Trivy (versão fixa, assinatura verificada)
        run: |
          ASSET="trivy_${TOOL_TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/${TOOL_TRIVY_VERSION}"
          curl -fsSL -O "${BASE_URL}/${ASSET}"
          curl -fsSL -O "${BASE_URL}/${ASSET}.sigstore.json"
          cosign verify-blob "$ASSET" \
            --bundle "${ASSET}.sigstore.json" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/${TOOL_TRIVY_VERSION}"
          tar -xzf "$ASSET" trivy
          sudo mv trivy /usr/local/bin/trivy
      - name: Rodar Trivy (vulnerabilidades de dependências)
        run: trivy fs --scanners vuln --format sarif --output trivy.sarif --severity CRITICAL,HIGH . || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn

  betterleaks:
    name: Segredos vazados (Betterleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo — segredo pode estar em commit antigo
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Instalar Betterleaks (versão fixa)
        # `go install` verifica o módulo contra o sumdb oficial (sum.golang.org).
        run: |
          go install "github.com/betterleaks/betterleaks@${TOOL_BETTERLEAKS_VERSION}"
          echo "GOBIN=$(go env GOPATH)/bin" >> "$GITHUB_ENV"
      - name: Rodar Betterleaks
        run: |
          "$GOBIN/betterleaks" git . --report-format sarif --report-path betterleaks.sarif || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: betterleaks-sarif
          path: betterleaks.sarif
          if-no-files-found: warn

  relatorio:
    name: Relatório + notificação
    needs: [opengrep, trivy, betterleaks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - name: Montar relatório HTML + decidir se é crítico
        id: montar
        run: node .github/scripts/security-gate-report.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-gate-relatorio
          path: relatorio.html
      - name: Falhar se houver crítico
        if: steps.montar.outputs.critico == 'true'
        run: |
          echo "::error::security-gate achou CRÍTICO — ver o artifact security-gate-relatorio."
          exit 1
